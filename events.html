<!doctype html>
<html lang="de">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | Dorfdulli Racing</title>

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #050505;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      padding: 80px 24px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 60px;
    }

    .logo {
      height: 36px;
      filter: brightness(0) invert(1);
    }

    h1 {
      font-size: clamp(3rem,7vw,6rem);
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      margin: 0 0 60px;
    }

    .event-card {
      max-width: 720px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.6);
      padding: 32px;
      backdrop-filter: blur(12px);
    }

    .date {
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
      margin-bottom: 8px;
    }

    .location {
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
      margin-bottom: 16px;
    }

    h3 {
      font-size: clamp(2rem,4vw,2.6rem);
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      margin: 0 0 14px;
    }

    p {
      color: rgba(255,255,255,.7);
      line-height: 1.4;
      max-width: 520px;
    }

    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 26px;
      background: #fff;
      color: #000;
      font-weight: 900;
      text-transform: uppercase;
      text-decoration: none;
    }

    .back {
      margin-top: 60px;
      display: inline-block;
      color: rgba(255,255,255,.5);
      text-decoration: none;
      text-transform: uppercase;
      font-size: 12px;
    }

</head>
<body>

  <!-- TOP BAR -->
  <div class="top">
    <img src="images/logo.PNG" class="logo" alt="Dorfdulli Racing">
    <a href="index.html" class="back">← Startseite</a>
  </div>

  <h1>Events</h1>

  <!-- EVENT -->
  <div class="event-card">

    <div class="date">11. April 2026</div>
    <div class="location">Torgau / Neiden – Rennstrecke „Am Österreicher“</div>

    <h3>3H Block’N’Duro</h3>

    <p>
      3 Stunden Enduro beim MSC Pflückuff auf einem ca. 6 km langen Rundkurs
      mit Waldpassagen, Auf- und Abfahrten, Hindernissen und Wasserdurchfahrten.
    </p>

    <a 
      href="https://www.msc-pflueckuff.de/news/1/1212463/nachrichten/3h-blocknduro-2026.html"
      target="_blank"
      class="btn"
    >
      Mehr Infos
    </a>

  </div>
