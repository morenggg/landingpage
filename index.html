<!doctype html>
<html lang="de" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Dorfdulli Racing | Motocross & Enduro</title>
  <meta name="description" content="Dorfdulli Racing – Motocross & Enduro Community. Offroad, Bikes und Szene.">
  <link rel="icon" type="image/png" href="images/favicon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-dark: #050505;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #050505;
    }

    body {
      font-family: 'Barlow Condensed', sans-serif;
      background-color: var(--bg-dark);
      color: #fff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      position: relative;
    }

    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    .hero-video-wrapper {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
      pointer-events: none;
    }

    .hero-video-wrapper video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      min-width: 100vw;
      min-height: 100vh;
      object-fit: cover;
      object-position: center;
      transform: translate(-50%, -50%);
      filter: grayscale(100%) brightness(0.52) contrast(1.08);
      background: #000;
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle at center, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.24) 45%, rgba(0,0,0,0.68) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.04) 25%, rgba(0,0,0,0.12) 55%, rgba(5,5,5,0.62) 100%);
      pointer-events: none;
    }

    header, main, footer {
      position: relative;
    }

    header {
      z-index: 9999;
      isolation: isolate;
    }

    main, footer {
      z-index: 10;
    }

    .glass-nav {
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      background: rgba(0,0,0,0.58);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transition:
        background 0.3s ease,
        backdrop-filter 0.3s ease,
        -webkit-backdrop-filter 0.3s ease,
        border-color 0.3s ease;
    }

    .glass-nav.scrolled {
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      background: rgba(0,0,0,0.78);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .logo-white {
      filter: brightness(0) invert(1) contrast(1.12);
    }

    .hero-subcopy {
      max-width: 38rem;
    }

    .quote-main {
      font-size: clamp(1.15rem, 3.6vw, 2.1rem);
      line-height: 1;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .quote-author-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      opacity: 0.7;
    }

    .quote-line {
      width: 38px;
      height: 2px;
      background: #fff;
      opacity: 0.6;
      flex: 0 0 auto;
    }

    .quote-author {
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1;
    }

    .gallery-wrap {
      max-width: 68rem;
      margin: 0 auto;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4/5;
      background: #111;
      border: 1px solid rgba(255,255,255,0.05);
      z-index: 1;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(1);
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      display: block;
    }

    .gallery-item:hover img {
      filter: grayscale(0);
      transform: scale(1.05);
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.2, 1, 0.3, 1);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .btn-racing {
      padding: 1rem 2.5rem;
      background: #fff;
      color: #000;
      font-weight: 900;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .btn-racing:hover {
      transform: skewX(-6deg);
      background: #d9d9d9;
    }

    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }

    .menu-btn {
      width: 40px;
      height: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      gap: 6px;
      background: transparent;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    .menu-btn span {
      display: block;
      height: 2px;
      background: #fff;
      border-radius: 999px;
      transition: transform 0.28s ease, opacity 0.28s ease, width 0.28s ease;
    }

    .menu-btn span:first-child {
      width: 32px;
    }

    .menu-btn span:last-child {
      width: 20px;
    }

    .menu-open .menu-btn span:first-child {
      transform: translateY(4px) rotate(45deg);
      width: 28px;
    }

    .menu-open .menu-btn span:last-child {
      transform: translateY(-4px) rotate(-45deg);
      width: 28px;
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 9997;
      background: rgba(0,0,0,0.36);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .menu-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .side-menu {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: min(88vw, 420px);
      z-index: 9998;
      background:
        linear-gradient(180deg, rgba(18,18,18,0.96) 0%, rgba(5,5,5,0.98) 100%);
      border-left: 1px solid rgba(255,255,255,0.08);
      box-shadow: -20px 0 60px rgba(0,0,0,0.45);
      transform: translateX(100%);
      transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding:
        max(26px, env(safe-area-inset-top))
        26px
        max(26px, env(safe-area-inset-bottom))
        26px;
    }

    .side-menu.active {
      transform: translateX(0);
    }

    .side-menu-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .side-menu-title {
      font-size: 0.8rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    .menu-close {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      color: #fff;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
    }

    .menu-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .menu-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      text-decoration: none;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .menu-link:hover {
      opacity: 0.72;
      transform: translateX(4px);
    }

    .menu-link-label {
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .menu-link-meta {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.36);
      margin-left: 16px;
      flex: 0 0 auto;
    }

    .menu-footer {
      margin-top: auto;
      padding-top: 24px;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }

    .menu-link.placeholder {
      cursor: default;
    }

    .menu-link.placeholder:hover {
      opacity: 1;
      transform: none;
    }

    @media (max-width: 767px) {
      .quote-main {
        font-size: clamp(0.98rem, 4.3vw, 1.2rem);
        white-space: nowrap;
      }

      .quote-author {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
      }

      .quote-line {
        width: 28px;
      }

      .gallery-wrap {
        max-width: 94%;
      }

      .side-menu {
        width: min(92vw, 380px);
      }

      .menu-link-label {
        font-size: clamp(1.35rem, 7vw, 1.9rem);
      }
    }
  </style>
</head>
<body id="top">

  <div class="hero-video-wrapper" aria-hidden="true">
    <video
      id="bg-video"
      muted
      autoplay
      loop
      playsinline
      preload="metadata"
    >
      <source src="images/hero.MP4" type="video/mp4">
    </video>
  </div>

  <div class="vignette-overlay"></div>

  <div class="menu-overlay" id="menu-overlay"></div>

  <aside class="side-menu" id="side-menu" aria-hidden="true">
    <div class="side-menu-top">
      <div class="side-menu-title">Navigation</div>
      <button class="menu-close" id="menu-close" aria-label="Menü schließen">✕</button>
    </div>

    <nav class="menu-nav">
      <a class="menu-link" href="#top">
        <span class="menu-link-label">Startseite</span>
        <span class="menu-link-meta">Live</span>
      </a>

      <div class="menu-link placeholder">
        <span class="menu-link-label">Gallery</span>
        <span class="menu-link-meta">Soon</span>
      </div>

      <div class="menu-link placeholder">
        <span class="menu-link-label">Events</span>
        <span class="menu-link-meta">Soon</span>
      </div>

      <div class="menu-link placeholder">
        <span class="menu-link-label">Blog</span>
        <span class="menu-link-meta">Soon</span>
      </div>

      <a class="menu-link" href="https://www.instagram.com/dorfdulli.racing" target="_blank" rel="noopener noreferrer">
        <span class="menu-link-label">Instagram</span>
        <span class="menu-link-meta">Open</span>
      </a>

      <div class="menu-link placeholder">
        <span class="menu-link-label">Impressum</span>
        <span class="menu-link-meta">Soon</span>
      </div>

      <a class="menu-link" href="https://www.jhandpizzaservice.de" target="_blank" rel="noopener noreferrer">
        <span class="menu-link-label">Pizza</span>
        <span class="menu-link-meta">Open</span>
      </a>
    </nav>

    <div class="menu-footer">
      Dorfdulli Racing
    </div>
  </aside>

  <header class="fixed top-0 left-0 w-full glass-nav pt-safe" id="site-header">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <div class="flex items-center">
        <img src="images/logo.PNG" alt="Dorfdulli Racing Logo" class="h-8 md:h-10 w-auto logo-white">
      </div>

      <nav class="hidden md:flex gap-8 text-xs font-bold uppercase tracking-[0.2em]">
        <span class="opacity-60">Startseite</span>
        <span class="opacity-60">Events</span>
        <span class="opacity-60">Blog</span>
      </nav>

      <button class="menu-btn" id="menu-btn" aria-label="Menü öffnen" aria-expanded="false" aria-controls="side-menu">
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="relative min-h-screen flex items-end pb-20 md:pb-32 px-6">
      <div class="max-w-7xl mx-auto w-full">
        <div class="reveal">
          <div class="mt-8 flex flex-col md:flex-row md:items-end justify-between gap-10">
            <div class="hero-subcopy">
              <p class="quote-main text-gray-100">
                „Halbgas ist verschwendete Lebenszeit.“
              </p>

              <div class="quote-author-wrap">
                <span class="quote-line"></span>
                <span class="quote-author">Erich Honecker</span>
              </div>
            </div>

            <a href="#gallery" class="btn-racing">Explore the Crew</a>
          </div>
        </div>
      </div>
    </section>

    <section id="gallery" class="relative py-32 px-6">
      <div class="max-w-7xl mx-auto">
        <div class="mb-20 reveal">
          <h2 class="text-6xl md:text-8xl font-black italic uppercase leading-none">The Crew</h2>
          <div class="h-1 w-20 bg-white mt-4"></div>
        </div>

        <div class="gallery-wrap">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-5">
            <div class="gallery-item reveal" style="transition-delay: 0.1s;">
              <img src="images/IMG_0673.jpeg" alt="Motocross Bike Dorfdulli Racing" loading="lazy">
            </div>
            <div class="gallery-item reveal md:translate-y-12" style="transition-delay: 0.2s;">
              <img src="images/IMG_0674.jpeg" alt="Enduro Bike Offroad" loading="lazy">
            </div>
            <div class="gallery-item reveal" style="transition-delay: 0.3s;">
              <img src="images/IMG_0662.jpeg" alt="Motocross Treffen" loading="lazy">
            </div>
            <div class="gallery-item reveal md:translate-y-12" style="transition-delay: 0.4s;">
              <img src="images/IMG_0663.jpeg" alt="Enduro Szene" loading="lazy">
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-black/60 border-t border-white/5 py-12 px-6 pb-safe">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
      <div class="flex items-center gap-3">
        <img src="images/logo.PNG" alt="Dorfdulli Racing Logo" class="h-6 w-auto logo-white">
        <span class="text-xs font-bold uppercase tracking-widest text-gray-400">© 2026 Dorfdulli Racing</span>
      </div>
      <div class="flex gap-10 text-[10px] font-black uppercase tracking-[0.2em] text-gray-500">
        <a href="https://www.instagram.com/dorfdulli.racing" class="hover:text-white transition" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="#" class="hover:text-white transition">Impressum</a>
      </div>
    </div>
  </footer>

  <script>
    const observerOptions = {
      threshold: 0.15,
      rootMargin: "0px 0px -50px 0px"
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, observerOptions);

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    const video = document.getElementById('bg-video');

    function startVideo() {
      if (!video) return;
      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      const p = video.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }

    window.addEventListener('load', startVideo);
    document.addEventListener('DOMContentLoaded', startVideo);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) startVideo();
    });
    document.addEventListener('touchstart', startVideo, { passive: true });
    document.addEventListener('click', startVideo, { passive: true });

    const header = document.getElementById('site-header');

    function updateHeader() {
      if (!header) return;
      if (window.scrollY > 20) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    }

    updateHeader();
    window.addEventListener('scroll', updateHeader, { passive: true });

    const body = document.body;
    const menuBtn = document.getElementById('menu-btn');
    const menuClose = document.getElementById('menu-close');
    const sideMenu = document.getElementById('side-menu');
    const menuOverlay = document.getElementById('menu-overlay');

    function openMenu() {
      body.classList.add('menu-open');
      sideMenu.classList.add('active');
      menuOverlay.classList.add('active');
      sideMenu.setAttribute('aria-hidden', 'false');
      menuBtn.setAttribute('aria-expanded', 'true');
      body.style.overflow = 'hidden';
    }

    function closeMenu() {
      body.classList.remove('menu-open');
      sideMenu.classList.remove('active');
      menuOverlay.classList.remove('active');
      sideMenu.setAttribute('aria-hidden', 'true');
      menuBtn.setAttribute('aria-expanded', 'false');
      body.style.overflow = '';
    }

    menuBtn.addEventListener('click', () => {
      if (sideMenu.classList.contains('active')) {
        closeMenu();
      } else {
        openMenu();
      }
    });

    menuClose.addEventListener('click', closeMenu);
    menuOverlay.addEventListener('click', closeMenu);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMenu();
    });

    sideMenu.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', closeMenu);
    });
  </script>
</body>
</html>
