<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Dorfdulli Racing | Motocross & Enduro</title>

  <meta name="description" content="Dorfdulli Racing – Motocross & Enduro Community. Offroad, Bikes und Szene.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://dorfdulliracing.de/">
  <link rel="icon" type="image/png" href="images/favicon.png">

  <meta property="og:title" content="Dorfdulli Racing | Motocross & Enduro">
  <meta property="og:description" content="Dorfdulli Racing – Motocross & Enduro Community. Offroad, Bikes und Szene.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dorfdulliracing.de/">

  <!-- iOS / Safari meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N68H1PYZXY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N68H1PYZXY');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      -ms-overflow-style: none;
      scrollbar-width: none;
      height: -webkit-fill-available;
    }

    html::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ── BACKGROUND VIDEO ── */
    .bg-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-wrap video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      object-position: center;
      filter: grayscale(100%) brightness(0.38);
      -webkit-mask-image: -webkit-radial-gradient(white, black);
    }

    .bg-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 20%),
        linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.65) 35%, rgba(0,0,0,0.1) 70%);
      pointer-events: none;
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 60px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 0 16px;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      transition:
        background 0.45s ease,
        backdrop-filter 0.45s ease,
        -webkit-backdrop-filter 0.45s ease,
        border-color 0.45s ease;
      border-bottom: 1px solid transparent;
    }

    header.scrolled {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-color: rgba(255, 255, 255, 0.07);
    }

    .nav-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.88);
      transition: opacity 0.25s ease;
      cursor: pointer;
      -webkit-touch-callout: none;
    }

    .nav-btn:hover,
    .nav-btn:active {
      opacity: 0.5;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .nav-btn.right {
      justify-self: end;
      font-size: 16px;
      line-height: 1;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-wrap img {
      height: 36px;
      display: block;
      filter: invert(1) brightness(10);
      object-fit: contain;
      max-width: 140px;
    }

    /* ── GALLERY ── */
    main {
      position: relative;
      z-index: 10;
      padding-top: calc(60px + 8vw);
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: max(10vh, calc(env(safe-area-inset-bottom) + 40px));
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 480px;
      margin: 0 auto;
    }

    @media (min-width: 520px) {
      .gallery {
        max-width: 680px;
        gap: 16px;
      }
    }

    @media (min-width: 780px) {
      main {
        padding-top: calc(60px + 6vh);
      }
      .gallery {
        max-width: 860px;
        gap: 24px;
      }
    }

    @media (min-width: 1100px) {
      .gallery {
        max-width: 960px;
        gap: 32px;
      }
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 2px;
      opacity: 0;
      transform: translateY(36px);
      transition:
        opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gallery-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .gallery-item:nth-child(1) { transition-delay: 0.00s; }
    .gallery-item:nth-child(2) { transition-delay: 0.06s; }
    .gallery-item:nth-child(3) { transition-delay: 0.12s; }
    .gallery-item:nth-child(4) { transition-delay: 0.18s; }

    .gallery-item img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: center top;
      filter: grayscale(100%);
      opacity: 0.6;
      transform: scale(1.04);
      transition:
        filter 0.75s ease,
        opacity 0.75s ease,
        transform 0.85s ease;
      will-change: transform;
      image-rendering: -webkit-optimize-contrast;
    }

    @media (hover: hover) {
      .gallery-item:hover img {
        filter: grayscale(20%);
        opacity: 0.96;
        transform: scale(1);
      }
    }

    .gallery-item:active img {
      opacity: 0.85;
      transform: scale(1.01);
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 10;
      padding: 22px 20px;
      padding-bottom: max(28px, calc(env(safe-area-inset-bottom) + 20px));
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(0, 0, 0, 0.75);
    }

    .footer-copy {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
    }

    .footer-credit {
      display: inline-block;
      margin-top: 5px;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.18);
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer-credit:hover {
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>

<body>

  <h1 class="sr-only">Dorfdulli Racing – Motocross &amp; Enduro Community</h1>

  <div class="bg-wrap" aria-hidden="true">
    <video
      autoplay
      muted
      loop
      playsinline
      disablePictureInPicture
      disableRemotePlayback
      x-webkit-airplay="deny"
      preload="auto"
    >
      <source src="images/IMG_7169.mp4.MP4" type="video/mp4">
    </video>
  </div>

  <header id="site-header">
    <a class="nav-btn"
       href="https://www.instagram.com/dorfdulli.racing"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Instagram">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="0.1" fill="currentColor" stroke-width="3"/>
      </svg>
    </a>

    <div class="logo-wrap">
      <img src="images/logo.PNG" alt="Dorfdulli Racing Logo">
    </div>

    <a class="nav-btn right"
       href="https://www.jhandpizzaservice.de"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Pizza Service">
      🍕
    </a>
  </header>

  <main>
    <section class="gallery" aria-label="Dorfdulli Racing Gallery">

      <div class="gallery-item">
        <img src="images/IMG_0673.jpeg" alt="Motocross Bike Dorfdulli Racing" loading="lazy" decoding="async">
      </div>

      <div class="gallery-item">
        <img src="images/IMG_0674.jpeg" alt="Enduro Bike Offroad" loading="lazy" decoding="async">
      </div>

      <div class="gallery-item">
        <img src="images/IMG_0662.jpeg" alt="Motocross Treffen" loading="lazy" decoding="async">
      </div>

      <div class="gallery-item">
        <img src="images/IMG_0663.jpeg" alt="Enduro Szene" loading="lazy" decoding="async">
      </div>

    </section>
  </main>

  <footer>
    <p class="footer-copy">© 2026 Dorfdulli Racing</p>
    <a class="footer-credit"
       href="https://www.instagram.com/ultrafuckingviolett"
       target="_blank"
       rel="noopener noreferrer">
      @ULTRAFUCKINGVIOLETT
    </a>
  </footer>

  <script>
    // Glassy header on scroll
    const header = document.getElementById('site-header');
    window.addEventListener('scroll', () => {
      header.classList.toggle('scrolled', window.scrollY > 20);
    }, { passive: true });

    // Gallery scroll-in animations
    const items = document.querySelectorAll('.gallery-item');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
    items.forEach(item => io.observe(item));

    // iOS video autoplay fallback
    const video = document.querySelector('.bg-wrap video');
    if (video) {
      video.play().catch(() => {});
      document.addEventListener('touchstart', () => video.play().catch(() => {}), { once: true, passive: true });
      document.addEventListener('click', () => video.play().catch(() => {}), { once: true, passive: true });
    }
  </script>

</body>
</html>
