<!doctype html>
<html lang="de" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Dorfdulli Racing | Motocross & Enduro</title>

  <meta name="description" content="Dorfdulli Racing – Motocross & Enduro Community. Offroad, Bikes und Szene.">
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Apple Specific -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-dark: #050505;
      --accent: #ffffff;
    }

    body {
      font-family: 'Barlow Condensed', sans-serif;
      background-color: var(--bg-dark);
      color: #fff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide Scrollbar */
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    /* Background Video Engine */
    .hero-video-wrapper {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background: #000;
    }

    .hero-video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) brightness(0.35) contrast(1.1);
      transform: scale(1.02);
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 50%, #050505 100%);
      pointer-events: none;
    }

    /* Typography & Visuals */
    .hero-title {
      font-size: clamp(3.5rem, 15vw, 12rem);
      line-height: 0.8;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      font-weight: 900;
      font-style: italic;
    }

    .outline-text {
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.6);
      color: transparent;
    }

    .glass-nav {
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      background: rgba(0,0,0,0.6);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    /* Gallery Styling */
    .gallery-item {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4/5;
      background: #111;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(1);
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .gallery-item:hover img {
      filter: grayscale(0);
      transform: scale(1.05);
    }

    /* Scroll Reveal */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.2, 1, 0.3, 1);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .btn-racing {
      padding: 1rem 2.5rem;
      background: #fff;
      color: #000;
      font-weight: 900;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .btn-racing:hover {
      transform: skewX(-6deg);
      background: #cccccc;
    }

    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }
  </style>
</head>
<body>

  <!-- Cinematic Background Assets -->
  <div class="hero-video-wrapper">
    <video autoplay muted loop playsinline>
      <source src="videos/hero.mp4" type="video/mp4">
    </video>
  </div>
  <div class="vignette-overlay"></div>

  <!-- Header -->
  <header class="fixed top-0 left-0 w-full z-50 glass-nav pt-safe">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="images/favicon.png" alt="Logo" class="h-8 md:h-10 w-auto">
        <span class="font-black text-xl italic tracking-tighter uppercase">Dorfdulli <span class="outline-text">Racing</span></span>
      </div>
      <nav class="hidden md:flex gap-8 text-xs font-bold uppercase tracking-[0.2em]">
        <a href="#gallery" class="hover:opacity-60 transition">Gallery</a>
        <a href="#" class="hover:opacity-60 transition">Enduro</a>
        <a href="#" class="hover:opacity-60 transition">Motocross</a>
      </nav>
      <div class="w-10 h-10 flex flex-col justify-center items-end gap-1.5 cursor-pointer">
        <div class="w-8 h-[2px] bg-white"></div>
        <div class="w-5 h-[2px] bg-white"></div>
      </div>
    </div>
  </header>

  <main>
    <!-- Hero Section -->
    <section class="relative min-h-screen flex items-end pb-20 md:pb-32 px-6">
      <div class="max-w-7xl mx-auto w-full">
        <div class="reveal">
          <h1 class="hero-title">
            DORFDULLI<br>
            <span class="outline-text">RACING</span>
          </h1>
          <div class="mt-8 flex flex-col md:flex-row md:items-end justify-between gap-10">
            <p class="max-w-md text-xl md:text-2xl font-bold uppercase italic leading-tight text-gray-300">
              Motocross & Enduro Community.<br>Offroad, Bikes und Szene.
            </p>
            <a href="#gallery" class="btn-racing">Explore the Crew</a>
          </div>
        </div>
      </div>
    </section>

    <!-- Gallery Section -->
    <section id="gallery" class="relative z-10 bg-[#050505] py-32 px-6">
      <div class="max-w-7xl mx-auto">
        <div class="mb-20 reveal">
          <h2 class="text-6xl md:text-8xl font-black italic uppercase leading-none">The <span class="outline-text">Vision</span></h2>
          <div class="h-1 w-20 bg-white mt-4"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <div class="gallery-item reveal" style="transition-delay: 0.1s;">
            <img src="images/gallery-1.jpg" alt="Action Shot 1">
          </div>
          <div class="gallery-item reveal md:translate-y-16" style="transition-delay: 0.2s;">
            <img src="images/gallery-2.jpg" alt="Action Shot 2">
          </div>
          <div class="gallery-item reveal" style="transition-delay: 0.3s;">
            <img src="images/gallery-3.jpg" alt="Action Shot 3">
          </div>
        </div>
      </div>
    </section>

    <!-- Final CTA -->
    <section class="relative z-10 bg-[#050505] pt-20 pb-40 px-6 overflow-hidden">
      <div class="max-w-7xl mx-auto text-center reveal">
        <div class="mb-12 inline-block">
            <img src="images/favicon.png" alt="Icon" class="h-24 w-auto opacity-30 grayscale mx-auto">
        </div>
        <h2 class="text-5xl md:text-7xl font-black italic uppercase mb-8">Ready to send it?</h2>
        <p class="text-gray-500 font-bold uppercase tracking-[0.3em] text-sm">Join the Dorfdulli Movement</p>
      </div>
    </section>
  </main>

  <footer class="relative z-10 bg-black border-t border-white/5 py-12 px-6 pb-safe">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
      <div class="flex items-center gap-3">
        <img src="images/favicon.png" alt="Footer Logo" class="h-6 w-auto">
        <span class="text-xs font-bold uppercase tracking-widest text-gray-400">© 2024 Dorfdulli Racing</span>
      </div>
      <div class="flex gap-10 text-[10px] font-black uppercase tracking-[0.2em] text-gray-500">
        <a href="#" class="hover:text-white transition">Instagram</a>
        <a href="#" class="hover:text-white transition">YouTube</a>
        <a href="#" class="hover:text-white transition">Impressum</a>
      </div>
    </div>
  </footer>

  <script>
    // Reveal Animations on Scroll
    const observerOptions = {
      threshold: 0.15,
      rootMargin: "0px 0px -50px 0px"
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, observerOptions);

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // Parallax effect on video for smoothness
    window.addEventListener('scroll', () => {
      const video = document.querySelector('.hero-video-wrapper video');
      let offset = window.pageYOffset;
      video.style.transform = `scale(1.02) translateY(${offset * 0.4}px)`;
    });
  </script>
</body>
</html>
