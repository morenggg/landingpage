<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Dorfdulli Racing | Motocross & Enduro</title>

  <meta name="description" content="Dorfdulli Racing – Motocross & Enduro Community. Offroad, Bikes und Szene.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://dorfdulliracing.de/">
  <link rel="icon" type="image/png" href="images/favicon.png">

  <meta property="og:title" content="Dorfdulli Racing | Motocross & Enduro">
  <meta property="og:description" content="Dorfdulli Racing – Motocross & Enduro Community. Offroad, Bikes und Szene.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dorfdulliracing.de/">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N68H1PYZXY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N68H1PYZXY');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      -ms-overflow-style: none;
      scrollbar-width: none;
      height: -webkit-fill-available;
    }

    html::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Background */
    .bg-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #000;
    }

    .bg-fallback,
    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .bg-fallback {
      background-image: url("images/IMG_0673.jpeg");
      background-size: cover;
      background-position: center center;
      filter: grayscale(100%) brightness(0.22);
      transform: scale(1.04);
    }

    .bg-video {
      object-fit: cover;
      object-position: center center;
      opacity: 0;
      transition: opacity 0.6s ease;
      filter: grayscale(100%) brightness(0.24);
    }

    .bg-video.is-ready {
      opacity: 1;
    }

    .bg-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.34) 0%,
          rgba(0,0,0,0.18) 20%,
          rgba(0,0,0,0.52) 58%,
          rgba(0,0,0,0.88) 100%
        );
      pointer-events: none;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 64px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 0 16px;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      border-bottom: 1px solid transparent;
      transition:
        background 0.4s ease,
        border-color 0.4s ease,
        backdrop-filter 0.4s ease,
        -webkit-backdrop-filter 0.4s ease;
    }

    header.scrolled {
      background: rgba(0, 0, 0, 0.34);
      border-color: rgba(255,255,255,0.06);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
    }

    .nav-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: rgba(255,255,255,0.9);
      transition: opacity 0.25s ease, transform 0.25s ease, background 0.25s ease;
      -webkit-touch-callout: none;
    }

    .nav-btn:hover,
    .nav-btn:active {
      opacity: 0.75;
      transform: scale(0.98);
      background: rgba(255,255,255,0.11);
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .nav-btn.right {
      justify-self: end;
      font-size: 16px;
      line-height: 1;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-wrap img {
      height: 34px;
      max-width: 150px;
      display: block;
      object-fit: contain;
      filter: invert(1) brightness(10);
    }

    /* Main */
    main {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      padding-top: calc(64px + 20vh);
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: max(24px, calc(env(safe-area-inset-bottom) + 24px));
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .gallery-shell {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      width: min(68vw, 260px);
      margin: 0 auto;
      opacity: 0;
      transform: translateY(24px);
      transition:
        opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gallery.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (min-width: 900px) {
      main {
        padding-top: calc(64px + 22vh);
      }

      .gallery {
        grid-template-columns: 1fr 1fr;
        width: min(34vw, 420px);
        gap: 16px;
      }
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 2px;
      background: rgba(255,255,255,0.03);
      box-shadow: 0 10px 30px rgba(0,0,0,0.14);
    }

    .gallery-item img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center;
      filter: grayscale(100%);
      opacity: 0.58;
      transform: scale(1.02);
      transition:
        opacity 0.7s ease,
        filter 0.7s ease,
        transform 0.7s ease;
    }

    @media (hover: hover) {
      .gallery-item:hover img {
        opacity: 0.9;
        filter: grayscale(18%);
        transform: scale(1);
      }
    }

    .gallery-item:active img {
      opacity: 0.78;
      transform: scale(1.01);
    }

    footer {
      position: relative;
      z-index: 10;
      padding: 20px;
      padding-bottom: max(28px, calc(env(safe-area-inset-bottom) + 18px));
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.72);
    }

    .footer-copy {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.34);
      text-transform: uppercase;
    }

    .footer-credit {
      display: inline-block;
      margin-top: 5px;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.2);
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer-credit:hover {
      color: rgba(255,255,255,0.5);
    }
  </style>
</head>

<body>

  <h1 class="sr-only">Dorfdulli Racing – Motocross &amp; Enduro Community</h1>

  <div class="bg-wrap" aria-hidden="true">
    <div class="bg-fallback"></div>
    <video
      class="bg-video"
      muted
      autoplay
      loop
      playsinline
      preload="auto"
      disablePictureInPicture
    >
      <source src="images/IMG_7169.mp4" type="video/mp4">
    </video>
  </div>

  <header id="site-header">
    <a class="nav-btn"
       href="https://www.instagram.com/dorfdulli.racing"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Instagram">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle cx="17.5" cy="6.5" r="0.1" fill="currentColor" stroke-width="3"></circle>
      </svg>
    </a>

    <div class="logo-wrap">
      <img src="images/logo.PNG" alt="Dorfdulli Racing Logo">
    </div>

    <a class="nav-btn right"
       href="https://www.jhandpizzaservice.de"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Pizza Service">
      🍕
    </a>
  </header>

  <main>
    <div class="gallery-shell">
      <section class="gallery" id="gallery" aria-label="Dorfdulli Racing Gallery">
        <div class="gallery-item">
          <img src="images/IMG_0673.jpeg" alt="Motocross Bike Dorfdulli Racing" loading="lazy" decoding="async">
        </div>
        <div class="gallery-item">
          <img src="images/IMG_0674.jpeg" alt="Enduro Bike Offroad" loading="lazy" decoding="async">
        </div>
        <div class="gallery-item">
          <img src="images/IMG_0662.jpeg" alt="Motocross Treffen" loading="lazy" decoding="async">
        </div>
        <div class="gallery-item">
          <img src="images/IMG_0663.jpeg" alt="Enduro Szene" loading="lazy" decoding="async">
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p class="footer-copy">© 2026 Dorfdulli Racing</p>
    <a class="footer-credit"
       href="https://www.instagram.com/ultrafuckingviolett"
       target="_blank"
       rel="noopener noreferrer">
      @ULTRAFUCKINGVIOLETT
    </a>
  </footer>

  <script>
    const header = document.getElementById('site-header');
    window.addEventListener('scroll', () => {
      header.classList.toggle('scrolled', window.scrollY > 20);
    }, { passive: true });

    const gallery = document.getElementById('gallery');
    const galleryObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          gallery.classList.add('visible');
          galleryObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });

    galleryObserver.observe(gallery);

    const video = document.querySelector('.bg-video');
    if (video) {
      const showVideo = () => {
        video.classList.add('is-ready');
      };

      const tryPlay = async () => {
        try {
          await video.play();
        } catch (e) {}
      };

      video.addEventListener('playing', showVideo);
      video.addEventListener('canplay', showVideo);
      video.addEventListener('loadeddata', () => {
        tryPlay();
      });

      window.addEventListener('load', tryPlay, { once: true });
      document.addEventListener('touchstart', tryPlay, { once: true, passive: true });
    }
  </script>

</body>
</html>
