<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dorfdulli Racing | Motocross & Enduro</title>

  <meta name="description" content="Dorfdulli Racing – Motocross & Enduro Community. Offroad, Bikes und Szene.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://dorfdulliracing.de/">
  <link rel="icon" type="image/png" href="images/favicon.png">

  <meta property="og:title" content="Dorfdulli Racing | Motocross & Enduro">
  <meta property="og:description" content="Dorfdulli Racing – Motocross & Enduro Community. Offroad, Bikes und Szene.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dorfdulliracing.de/">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N68H1PYZXY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N68H1PYZXY');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ── BG VIDEO ── */
    .bg-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) brightness(0.42);
    }

    .bg-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 1) 0%,
        rgba(0, 0, 0, 0.6) 40%,
        rgba(0, 0, 0, 0.25) 100%
      );
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 64px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 18px;
      transition: background 0.5s ease, backdrop-filter 0.5s ease, border-color 0.5s ease;
      border-bottom: 1px solid transparent;
    }

    header.scrolled {
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-color: rgba(255, 255, 255, 0.06);
    }

    .nav-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.13);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: opacity 0.3s ease;
    }

    .nav-btn:hover {
      opacity: 0.55;
    }

    .nav-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 1.7;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-btn.right {
      justify-self: end;
      font-size: 17px;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-wrap img {
      height: 40px;
      display: block;
      filter: invert(1) brightness(2);
      object-fit: contain;
    }

    /* ── MAIN / GALLERY ── */
    main {
      position: relative;
      z-index: 10;
      padding: 36vh 20px 14vh;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      max-width: 960px;
      margin: 0 auto;
    }

    @media (min-width: 600px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 28px;
      }
    }

    @media (min-width: 900px) {
      .gallery {
        gap: 44px;
      }
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 1px;
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gallery-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .gallery-item:nth-child(1) { transition-delay: 0s; }
    .gallery-item:nth-child(2) { transition-delay: 0.07s; }
    .gallery-item:nth-child(3) { transition-delay: 0.14s; }
    .gallery-item:nth-child(4) { transition-delay: 0.21s; }

    .gallery-item img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      filter: grayscale(100%);
      opacity: 0.58;
      transform: scale(1.04);
      transition: filter 0.8s ease, opacity 0.8s ease, transform 0.9s ease;
      will-change: transform;
    }

    .gallery-item:hover img {
      filter: grayscale(25%);
      opacity: 0.95;
      transform: scale(1);
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 10;
      padding: 26px 20px 32px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(0, 0, 0, 0.7);
    }

    .footer-copy {
      font-size: 12px;
      letter-spacing: 0.16em;
      color: rgba(255, 255, 255, 0.38);
      text-transform: uppercase;
    }

    .footer-credit {
      display: block;
      margin-top: 6px;
      font-size: 10px;
      letter-spacing: 0.13em;
      color: rgba(255, 255, 255, 0.2);
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer-credit:hover {
      color: rgba(255, 255, 255, 0.55);
    }
  </style>
</head>

<body>

  <h1 class="sr-only">Dorfdulli Racing – Motocross &amp; Enduro Community</h1>

  <div class="bg-wrap">
    <video autoplay muted loop playsinline>
      <source src="images/IMG_7169.mp4.MP4" type="video/mp4">
    </video>
  </div>

  <header id="site-header">
    <a class="nav-btn"
       href="https://www.instagram.com/dorfdulli.racing"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Instagram">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="0.1" fill="currentColor" stroke-width="3"/>
      </svg>
    </a>

    <div class="logo-wrap">
      <img src="images/logo.PNG" alt="Dorfdulli Racing Logo">
    </div>

    <a class="nav-btn right"
       href="https://www.jhandpizzaservice.de"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Pizza Service">
      🍕
    </a>
  </header>

  <main>
    <section class="gallery" aria-label="Dorfdulli Racing Gallery">

      <div class="gallery-item">
        <img src="images/IMG_0673.jpeg" alt="Motocross Bike Dorfdulli Racing" loading="lazy">
      </div>

      <div class="gallery-item">
        <img src="images/IMG_0674.jpeg" alt="Enduro Bike Offroad" loading="lazy">
      </div>

      <div class="gallery-item">
        <img src="images/IMG_0662.jpeg" alt="Motocross Treffen" loading="lazy">
      </div>

      <div class="gallery-item">
        <img src="images/IMG_0663.jpeg" alt="Enduro Szene" loading="lazy">
      </div>

    </section>
  </main>

  <footer>
    <p class="footer-copy">© 2026 Dorfdulli Racing</p>
    <a class="footer-credit"
       href="https://www.instagram.com/ultrafuckingviolett"
       target="_blank"
       rel="noopener noreferrer">
      @ULTRAFUCKINGVIOLETT
    </a>
  </footer>

  <script>
    // Header glass on scroll
    const header = document.getElementById('site-header');
    window.addEventListener('scroll', () => {
      header.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });

    // Gallery scroll-in animations
    const items = document.querySelectorAll('.gallery-item');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });

    items.forEach(item => observer.observe(item));
  </script>

</body>
</html>
