<!doctype html>
<html lang="de" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Dorfdulli Racing | Motocross & Enduro</title>
  <meta name="description" content="Dorfdulli Racing – Motocross & Enduro Community. Offroad, Bikes und Szene.">
  <link rel="icon" type="image/png" href="images/favicon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-dark: #050505;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #050505;
    }

    body {
      font-family: 'Barlow Condensed', sans-serif;
      background-color: var(--bg-dark);
      color: #fff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      position: relative;
    }

    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    .hero-video-wrapper {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
      pointer-events: none;
    }

    .hero-video-wrapper video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      min-width: 100vw;
      min-height: 100vh;
      object-fit: cover;
      object-position: center;
      transform: translate(-50%, -50%);
      filter: grayscale(100%) brightness(0.52) contrast(1.08);
      background: #000;
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle at center, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.24) 45%, rgba(0,0,0,0.68) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.04) 25%, rgba(0,0,0,0.12) 55%, rgba(5,5,5,0.62) 100%);
      pointer-events: none;
    }

    header, main, footer {
      position: relative;
      z-index: 10;
    }

    .glass-nav {
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      background: rgba(0,0,0,0.58);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .logo-white {
      filter: brightness(0) invert(1) contrast(1.12);
    }

    .hero-subcopy {
      max-width: 34rem;
    }

    .quote-style {
      font-size: clamp(2.2rem, 6vw, 5rem);
      line-height: 0.95;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: -0.03em;
    }

    .gallery-wrap {
      max-width: 70rem;
      margin: 0 auto;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4/5;
      background: #111;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(1);
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .gallery-item:hover img {
      filter: grayscale(0);
      transform: scale(1.05);
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.2, 1, 0.3, 1);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .btn-racing {
      padding: 1rem 2.5rem;
      background: #fff;
      color: #000;
      font-weight: 900;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .btn-racing:hover {
      transform: skewX(-6deg);
      background: #d9d9d9;
    }

    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }

    @media (max-width: 767px) {
      .quote-style {
        font-size: clamp(2rem, 9vw, 3.5rem);
      }
    }
  </style>
</head>
<body>

  <div class="hero-video-wrapper" aria-hidden="true">
    <video
      id="bg-video"
      muted
      autoplay
      loop
      playsinline
      preload="metadata"
    >
      <source src="images/hero.MP4" type="video/mp4">
    </video>
  </div>

  <div class="vignette-overlay"></div>

  <header class="fixed top-0 left-0 w-full glass-nav pt-safe">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <div class="flex items-center">
        <img src="images/logo.PNG" alt="Dorfdulli Racing Logo" class="h-8 md:h-10 w-auto logo-white">
      </div>

      <nav class="hidden md:flex gap-8 text-xs font-bold uppercase tracking-[0.2em]">
        <a href="#gallery" class="hover:opacity-60 transition">Gallery</a>
        <a href="#" class="hover:opacity-60 transition">Enduro</a>
        <a href="#" class="hover:opacity-60 transition">Motocross</a>
      </nav>

      <div class="w-10 h-10 flex flex-col justify-center items-end gap-1.5 cursor-pointer" aria-label="Menü">
        <div class="w-8 h-[2px] bg-white"></div>
        <div class="w-5 h-[2px] bg-white"></div>
      </div>
    </div>
  </header>

  <main>
    <section class="relative min-h-screen flex items-end pb-20 md:pb-32 px-6">
      <div class="max-w-7xl mx-auto w-full">
        <div class="reveal">
          <div class="mt-8 flex flex-col md:flex-row md:items-end justify-between gap-10">
            <p class="hero-subcopy quote-style text-gray-100">
              „Halbgas ist verschwendete Lebenszeit.“ - Erich Honecker
            </p>
            <a href="#gallery" class="btn-racing">Explore the Crew</a>
          </div>
        </div>
      </div>
    </section>

    <section id="gallery" class="relative py-32 px-6">
      <div class="max-w-7xl mx-auto">
        <div class="mb-20 reveal">
          <h2 class="text-6xl md:text-8xl font-black italic uppercase leading-none">The Crew</h2>
          <div class="h-1 w-20 bg-white mt-4"></div>
        </div>

        <div class="gallery-wrap">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-5">
            <div class="gallery-item reveal" style="transition-delay: 0.1s;">
              <img src="images/IMG_0673.jpeg" alt="Motocross Bike Dorfdulli Racing" loading="lazy">
            </div>
            <div class="gallery-item reveal md:translate-y-12" style="transition-delay: 0.2s;">
              <img src="images/IMG_0674.jpeg" alt="Enduro Bike Offroad" loading="lazy">
            </div>
            <div class="gallery-item reveal" style="transition-delay: 0.3s;">
              <img src="images/IMG_0662.jpeg" alt="Motocross Treffen" loading="lazy">
            </div>
            <div class="gallery-item reveal md:translate-y-12" style="transition-delay: 0.4s;">
              <img src="images/IMG_0663.jpeg" alt="Enduro Szene" loading="lazy">
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-black/60 border-t border-white/5 py-12 px-6 pb-safe">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
      <div class="flex items-center gap-3">
        <img src="images/logo.PNG" alt="Dorfdulli Racing Logo" class="h-6 w-auto logo-white">
        <span class="text-xs font-bold uppercase tracking-widest text-gray-400">© 2026 Dorfdulli Racing</span>
      </div>
      <div class="flex gap-10 text-[10px] font-black uppercase tracking-[0.2em] text-gray-500">
        <a href="https://www.instagram.com/dorfdulli.racing" class="hover:text-white transition" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="#" class="hover:text-white transition">Impressum</a>
      </div>
    </div>
  </footer>

  <script>
    const observerOptions = {
      threshold: 0.15,
      rootMargin: "0px 0px -50px 0px"
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, observerOptions);

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    const video = document.getElementById('bg-video');

    function startVideo() {
      if (!video) return;
      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      const p = video.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }

    window.addEventListener('load', startVideo);
    document.addEventListener('DOMContentLoaded', startVideo);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) startVideo();
    });
    document.addEventListener('touchstart', startVideo, { passive: true });
    document.addEventListener('click', startVideo, { passive: true });
  </script>
</body>
</html>
