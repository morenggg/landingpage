<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N68H1PYZXY"></script>
  <script>

    function gtag(){dataLayer.push(arguments);}

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;}
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#000;
      color:#fff;
      overflow-x:hidden;
    }

    .bg-video{
      position:fixed;
      inset:0;
      z-index:-2;
      overflow:hidden;
    }
    .bg-video video{
      width:100%;
      height:100%;
      object-fit:cover;
      filter:grayscale(100%) brightness(.55);
    }
    .bg-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.6);
      z-index:-1;
    }

    header{
      position:sticky;
      top:0;
      backdrop-filter:blur(12px);
      background:rgba(0,0,0,.55);
      z-index:10;
    }
    .topbar{
      height:64px;
      padding:0 16px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
    }
    .logo img{
      height:42px;
      filter:invert(1);
      display:block;
      margin:0 auto;
    }

    .icon-btn{
      width:34px;
      height:34px;
      border-radius:50%;
      background:#fff;
      color:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
    }
    .icon-btn.right{justify-self:end;}

    main{
      padding:50px 0 80px;
      display:flex;
      justify-content:center;
    }
    .gallery{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:22px;
    }

    .gallery img{
      width:48%;
      max-width:320px;
      border-radius:16px;
      display:block;
      filter:grayscale(100%);
      opacity:0.55;
      transition:opacity .35s ease, filter .35s ease;
    }

    .gallery img:hover{
      opacity:0.8;
      filter:grayscale(60%);
    }

    .countdown{
      width:48%;
      max-width:320px;
      aspect-ratio:4/3;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      border-radius:16px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      opacity:0.7;
      text-align:center;
      padding:18px;
    }

    .countdown-label{
      font-size:12px;
      letter-spacing:1.5px;
      color:rgba(255,255,255,.6);
      margin-bottom:6px;
    }

    .countdown-time{
      font-size:28px;
      letter-spacing:2px;
      font-weight:600;
      margin-bottom:10px;
    }

    .location-info{
      font-size:11px;
      line-height:1.45;
      color:rgba(255,255,255,.72);
      max-width:90%;
    }

    .location-info .muted{
      color:rgba(255,255,255,.5);
    }

    @media(min-width:900px){
      .gallery img,
      .countdown{
        width:32%;
      }
    }

    footer{
      padding:24px 0 30px;
      text-align:center;
      font-size:13px;
      color:rgba(255,255,255,.6);
    }

    .footer-mini{
      display:block;
      margin-top:4px;
      font-size:10px;
      color:rgba(255,255,255,.4);
      text-decoration:none;
    }

    .footer-mini:hover{
      opacity:0.8;
    }
  </style>
</head>

<body>

  <div class="bg-video">
    <video autoplay muted loop playsinline>
      <source src="images/IMG_7169.mp4.MP4" type="video/mp4">
    </video>
  </div>
  <div class="bg-overlay"></div>

  <header>
    <div class="topbar">

      <a class="icon-btn"
         href="https://www.instagram.com/dorfdulli.racing"
         target="_blank">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="2" width="20" height="20" rx="5"
                stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="5"
                  stroke="currentColor" stroke-width="2"/>
          <circle cx="17.5" cy="6.5" r="1.5"
                  fill="currentColor"/>
        </svg>
      </a>

      <div class="logo">
        <img src="images/logo.PNG" alt="Dorfdulli Racing">
      </div>

      <a class="icon-btn right"
         href="https://www.jhandpizzaservice.de"
         target="_blank">🍕</a>

    </div>
  </header>

  <main>
    <section class="gallery">

      <img src="images/IMG_0673.jpeg" alt="">
      <img src="images/IMG_0674.jpeg" alt="">

      <div class="countdown">
        <div class="countdown-label">COUNTDOWN BIS 20:00 UHR</div>
        <div class="countdown-time" id="time">00:00:00</div>
        <div class="location-info" id="locationInfo">
          Standort wird angefragt...
        </div>
      </div>

      <img src="images/IMG_0662.jpeg" alt="">
      <img src="images/IMG_0663.jpeg" alt="">

    </section>
  </main>

  <footer>
    © 2026 Dorfdulli Racing
    <a href="https://www.instagram.com/ultrafuckingviolett"
       target="_blank"
       class="footer-mini">
       @ULTRAFUCKINGVIOLETT
    </a>
  </footer>

  <script>
    function updateCountdown() {
      const now = new Date();

      const berlinNow = new Date(
        now.toLocaleString("en-US", { timeZone: "Europe/Berlin" })
      );

      let target = new Date(berlinNow);
      target.setHours(20, 0, 0, 0);

      const diff = target - berlinNow;

      if (diff <= 0) {
        document.getElementById("time").textContent = "DEJA";
        return;
      }

      const hours = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, '0');
      const minutes = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, '0');
      const seconds = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');

      document.getElementById("time").textContent = `${hours}:${minutes}:${seconds}`;
    }

    function haversineDistance(lat1, lon1, lat2, lon2) {
      const toRad = deg => deg * Math.PI / 180;
      const R = 6371;

      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);

      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function estimateDriveTimeMinutes(distanceKm) {
      const roadDistance = distanceKm * 1.25;
      const avgSpeed = 65;
      return Math.max(3, Math.round((roadDistance / avgSpeed) * 60));
    }

    function setLocationText(html) {
      document.getElementById("locationInfo").innerHTML = html;
    }

    function requestLocationInfo() {
      const targetLat = 51.5629;
      const targetLon = 13.0066;

      if (!navigator.geolocation) {
        setLocationText('<span class="muted">Standort wird von diesem Gerät nicht unterstützt.</span>');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const userLat = position.coords.latitude;
          const userLon = position.coords.longitude;

          const distanceKm = haversineDistance(userLat, userLon, targetLat, targetLon);
          const driveMinutes = estimateDriveTimeMinutes(distanceKm);

          setLocationText(
            'Bis Ritterstraße 6, 04860 Torgau:<br>' +
            distanceKm.toFixed(1).replace('.', ',') + ' km · ca. ' +
            driveMinutes + ' Min <span class="muted">(geschätzt)</span>'
          );
        },
        function(error) {
          if (error.code === error.PERMISSION_DENIED) {
            setLocationText('<span class="muted">Standortfreigabe wurde abgelehnt.</span>');
          } else {
            setLocationText('<span class="muted">Standort konnte nicht ermittelt werden.</span>');
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    window.addEventListener('load', function() {
      requestLocationInfo();
    });
  </script>

</body>
</html>
