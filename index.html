<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dorfdulli Racing | Motocross & Enduro</title>

  <meta name="description" content="Dorfdulli Racing – Motocross & Enduro Community. Offroad, Bikes und Szene.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://dorfdulliracing.de/">
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N68H1PYZXY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N68H1PYZXY');
  </script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:#000;
      color:#fff;
      overflow-x:hidden;
    }

    .visually-hidden{
      position:absolute;
      width:1px;
      height:1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
    }

    .bg-video{
      position:fixed;
      inset:0;
      z-index:-2;
    }

    .bg-video video{
      width:100%;
      height:100%;
      object-fit:cover;
      filter:grayscale(100%) brightness(.5);
    }

    .bg-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.6);
      z-index:-1;
    }

    header{
      position:sticky;
      top:0;
      backdrop-filter:blur(12px);
      background:rgba(0,0,0,.55);
      z-index:10;
    }

    .topbar{
      height:64px;
      padding:0 16px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
    }

    .logo img{
      height:42px;
      filter:invert(1);
      display:block;
      margin:0 auto;
    }

    .icon-btn{
      width:34px;
      height:34px;
      border-radius:50%;
      background:#fff;
      color:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      font-size:14px;
    }

    .icon-btn.right{justify-self:end;}

    main{
      padding:60px 0;
      display:flex;
      justify-content:center;
    }

    .gallery{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:22px;
    }

    .gallery img{
      width:48%;
      max-width:320px;
      border-radius:16px;
      display:block;
      filter:grayscale(100%);
      opacity:0.6;
      transition:.3s;
    }

    .gallery img:hover{
      opacity:0.9;
      filter:grayscale(60%);
    }

    @media(min-width:900px){
      .gallery img{
        width:32%;
      }
    }

    footer{
      padding:24px 0 30px;
      text-align:center;
      font-size:13px;
      color:rgba(255,255,255,.6);
    }

    .footer-mini{
      display:block;
      margin-top:4px;
      font-size:10px;
      color:rgba(255,255,255,.4);
      text-decoration:none;
    }

    .footer-mini:hover{
      opacity:0.8;
    }

  </style>
</head>

<body>

  <!-- UNSICHTBARE SEO H1 -->
  <h1 class="visually-hidden">
    Dorfdulli Racing – Motocross & Enduro Community
  </h1>

  <div class="bg-video">
    <video autoplay muted loop playsinline>
      <source src="images/IMG_7169.mp4.MP4" type="video/mp4">
    </video>
  </div>

  <div class="bg-overlay"></div>

  <header>
    <div class="topbar">

      <a class="icon-btn"
         href="https://www.instagram.com/dorfdulli.racing"
         target="_blank">IG</a>

      <div class="logo">
        <img src="images/logo.PNG" alt="Dorfdulli Racing Logo">
      </div>

      <a class="icon-btn right"
         href="https://www.jhandpizzaservice.de"
         target="_blank">🍕</a>

    </div>
  </header>

  <main>
    <section class="gallery">

      <img src="images/IMG_0673.jpeg" alt="Motocross Bike Dorfdulli Racing">
      <img src="images/IMG_0674.jpeg" alt="Enduro Bike Offroad">
      <img src="images/IMG_0662.jpeg" alt="Motocross Treffen">
      <img src="images/IMG_0663.jpeg" alt="Enduro Szene">

    </section>
  </main>

  <footer>
    © 2026 Dorfdulli Racing
    <a href="https://www.instagram.com/ultrafuckingviolett"
       target="_blank"
       class="footer-mini">
       @ULTRAFUCKINGVIOLETT
    </a>
  </footer>

</body>
</html>
