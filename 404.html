<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 – Abgeflogen | Dorfdulli Racing</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="theme-color" content="#050505">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#050505;
  --paper:#ece7de;
  --accent:#b8460e;
  --accent-bright:#d95a1f;
  --line:rgba(236,231,222,0.08);
  --line-strong:rgba(236,231,222,0.16);
  --mono:'JetBrains Mono',monospace;
  --display:'Barlow Condensed',sans-serif;
}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--paper);
  font-family:var(--display);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  background-image:radial-gradient(ellipse at top,rgba(184,70,14,0.07),transparent 55%);
}
a:focus-visible{outline:2px solid var(--accent-bright);outline-offset:3px}
::selection{background:var(--accent);color:#050505}

.grain{
  position:fixed;inset:-100px;z-index:5;pointer-events:none;
  opacity:0.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:180px 180px;
  animation:grain-shift 8s steps(8) infinite;
}
@keyframes grain-shift{
  0%{transform:translate(0,0)}20%{transform:translate(-3%,-2%)}40%{transform:translate(-6%,3%)}
  60%{transform:translate(4%,-4%)}80%{transform:translate(3%,5%)}100%{transform:translate(0,0)}
}

.header{
  padding:20px 24px;
  padding-top:max(20px,env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
}
.header img{height:30px;width:auto;filter:brightness(0) invert(1) contrast(1.12)}

.main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  position:relative;
  z-index:10;
}
.wrap{max-width:640px;width:100%}

.eyebrow{
  font-family:var(--mono);font-size:0.66rem;letter-spacing:0.3em;text-transform:uppercase;
  color:var(--accent-bright);display:flex;align-items:center;gap:10px;margin-bottom:20px;
}
.eyebrow::before{content:'';width:22px;height:1px;background:var(--accent-bright)}

.code{
  font-size:clamp(6rem,26vw,13rem);
  font-weight:900;font-style:italic;line-height:0.85;
  letter-spacing:-0.04em;
  color:transparent;
  -webkit-text-stroke:2px var(--accent-bright);
  user-select:none;
}
.title{
  font-size:clamp(2.2rem,8vw,4rem);
  font-weight:900;font-style:italic;text-transform:uppercase;
  line-height:0.95;letter-spacing:-0.02em;
  margin-top:10px;
}
.sub{
  font-size:1.15rem;
  color:rgba(236,231,222,0.6);
  margin-top:16px;
  max-width:34rem;
  line-height:1.45;
}
.mono-note{
  font-family:var(--mono);font-size:0.62rem;letter-spacing:0.16em;text-transform:uppercase;
  color:rgba(236,231,222,0.35);margin-top:14px;
}

.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.btn{
  font-family:var(--display);font-size:1.05rem;font-weight:900;font-style:italic;
  text-transform:uppercase;letter-spacing:0.04em;text-decoration:none;
  padding:15px 28px;display:inline-flex;align-items:center;justify-content:center;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);
  position:relative;overflow:hidden;isolation:isolate;
  transition:color 0.3s ease;
}
.btn::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:var(--accent-bright);
  transform:translateX(-101%) skewX(-12deg) scaleX(1.2);
  transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);
}
.btn:hover::before,.btn:focus-visible::before{transform:translateX(0) skewX(0) scaleX(1)}
.btn-primary{background:var(--paper);color:#050505}
.btn-ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn-ghost:hover,.btn-ghost:focus-visible{color:#050505}

.footer{
  padding:22px 24px;
  padding-bottom:max(22px,env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  font-family:var(--mono);font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;
  color:rgba(236,231,222,0.3);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.footer a{color:rgba(236,231,222,0.45);text-decoration:none}
.footer a:hover{color:var(--accent-bright)}

@media(prefers-reduced-motion:reduce){.grain{animation:none}}
</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="header">
  <a href="index.html" aria-label="Zur Startseite">
    <img src="images/logo.PNG" alt="Dorfdulli Racing Logo">
  </a>
</header>

<main class="main">
  <div class="wrap">
    <div class="eyebrow">Fehler 404 · Seite nicht gefunden</div>
    <div class="code" aria-hidden="true">404</div>
    <h1 class="title">Abgeflogen.</h1>
    <p class="sub">Diese Seite gibt's nicht – entweder ist der Link kaputt oder die Kurve war zu eng. Zurück auf die Strecke:</p>
    <div class="actions">
      <a href="index.html" class="btn btn-primary">Zur Startseite</a>
    </div>
    <p class="mono-note">Fahrer unverletzt · Bike läuft noch</p>
  </div>
</main>

<footer class="footer">
  <span>© 2026 Dorfdulli Racing</span>
  <a href="impressum.html">Impressum</a>
</footer>

</body>
</html>
