<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MopedPlaner – Deine digitale Simson-Werkstatt</title>
  <meta name="description" content="MopedPlaner: digitale Garage, Fahrzeugakte, geführte Diagnose, Technik-Wissen, Umbauplaner und Schraubenfinder für alle Simson-Fahrzeuge.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0c0f">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MopedPlaner">

  <link rel="preload" href="assets/fonts/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main id="view-root" aria-live="polite">
      <noscript>
        <div style="padding:48px 20px;text-align:center">
          <h1>MopedPlaner</h1>
          <p>Bitte JavaScript aktivieren – MopedPlaner ist eine Web-App und läuft vollständig in deinem Browser.</p>
        </div>
      </noscript>
    </main>
  </div>

  <nav id="tabbar" aria-label="Hauptnavigation"></nav>

  <script>
  /* Selbstheilung: Rendert die App nicht (z. B. wegen eines veralteten
     Service-Worker-Caches nach einem Update), werden Caches + Service Worker
     EINMAL geleert und die Seite neu geladen. Verhindert schwarze Bildschirme
     nach Deployments. Läuft nur einmal pro Sitzung – keine Reload-Schleife. */
  (function () {
    function rendered() {
      var r = document.getElementById('view-root');
      return !!(r && r.querySelector('.view, .onboard, .empty-state'));
    }
    function heal() {
      if (sessionStorage.getItem('mp-heal')) return;
      sessionStorage.setItem('mp-heal', '1');
      var reload = function () { location.reload(); };
      var jobs = [];
      try {
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (ks) {
            return Promise.all(ks.filter(function (k) { return k.indexOf('mopedplaner-') === 0; })
              .map(function (k) { return caches.delete(k); }));
          }));
        }
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
      } catch (e) { /* egal – trotzdem neu laden */ }
      Promise.all(jobs).catch(function () {}).then(reload);
      setTimeout(reload, 1500);
    }
    window.addEventListener('error', function (e) {
      if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) heal();
    }, true);
    window.addEventListener('load', function () {
      setTimeout(function () { if (!rendered()) heal(); }, 3500);
    });
    window.addEventListener('DOMContentLoaded', function () {
      // Erfolgreicher Start räumt den Heil-Marker wieder ab (nächster Fehler darf wieder heilen)
      setTimeout(function () { if (rendered()) sessionStorage.removeItem('mp-heal'); }, 4000);
    });
  })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
